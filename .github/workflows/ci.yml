name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx turbo run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx turbo run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: npm run build:server
      - name: Verify server binary
        run: |
          if [ ! -f packages/server/dist/polyrader-server ]; then
            echo "ERROR: Server binary not found!"
            exit 1
          fi
      - name: Task tracker tests (isolated)
        run: npm test --workspace @polyrader/server -- task-tracker-service system-tasks-api
      - run: npx turbo run test
      - name: Install Playwright browser
        run: cd packages/web && npx playwright install chromium
      - name: E2E tests
        run: cd packages/web && npm run test:e2e
      - name: Upload Sprint F visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint-f-visual-matrix
          path: packages/web/test-results/**/sprint-f-*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Integration E2E tests
        run: cd packages/web && npm run test:e2e:integration
      - name: Upload Sprint G release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint-g-release-diagnostics
          path: packages/web/test-results/**/sprint-g-release-gates*.json
          if-no-files-found: warn
          retention-days: 14

  live-trading-smoke:
    name: Live Trading Smoke
    runs-on: ubuntu-latest
    if: ${{ vars.POLYMARKET_LIVE_SMOKE_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browser
        run: cd packages/web && npx playwright install chromium
      - name: Live Polymarket smoke tests
        env:
          POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
          POLYMARKET_API_KEY: ${{ secrets.POLYMARKET_API_KEY }}
          POLYMARKET_API_SECRET: ${{ secrets.POLYMARKET_API_SECRET }}
          POLYMARKET_API_PASSPHRASE: ${{ secrets.POLYMARKET_API_PASSPHRASE }}
          POLYMARKET_ADDRESS: ${{ secrets.POLYMARKET_ADDRESS }}
          POLYMARKET_LIVE_TRADING_ENABLED: 'true'
        run: cd packages/web && npm run test:e2e:live
        continue-on-error: true

  build:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx turbo run build

  # Verify Tauri Rust code compiles (no full build, just cargo check)
  cargo-check:
    name: Cargo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Build server binary (required by tauri.conf.json resources)
        run: |
          npm ci
          npm run build:server
      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

  # Verify bun compile produces standalone binaries on all platforms
  bun-compile:
    name: Bun Compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: polyrader-server
          - os: windows-latest
            artifact: polyrader-server.exe
          - os: macos-latest
            artifact: polyrader-server
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - name: Build server bundle
        run: npm run build:server
      - name: Verify binary exists
        shell: bash
        run: |
          if [ ! -f "packages/server/dist/${{ matrix.artifact }}" ]; then
            echo "ERROR: Binary not found at packages/server/dist/${{ matrix.artifact }}"
            ls -la packages/server/dist/ || true
            exit 1
          fi
          echo "Binary size: $(du -h packages/server/dist/${{ matrix.artifact }} | cut -f1)"
      - name: Quick smoke test (Unix only)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          PORT=13999 POLYRADER_DATA_DIR=/tmp/bun-smoke-test POLYRADER_ENCRYPTION_KEY=test-key timeout 3 ./packages/server/dist/${{ matrix.artifact }} || true
          echo "Smoke test completed"

  tauri-sidecar-smoke:
    name: Tauri Sidecar and DB Smoke (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: npm run build:server
      - name: Run packaged sidecar smoke
        shell: bash
        run: |
          mkdir -p artifacts "$RUNNER_TEMP/polyrader-tauri-smoke"
          PORT=13998 \
          POLYRADER_DATA_DIR="$RUNNER_TEMP/polyrader-tauri-smoke" \
          POLYRADER_ENCRYPTION_KEY=ci-tauri-smoke-key \
          POLYRADER_SKIP_CRON=1 \
          POLYRADER_SKIP_STREAM=1 \
          POLYRADER_SKIP_EXTERNAL_HEALTH=1 \
          ./packages/server/dist/polyrader-server > artifacts/sidecar.log 2>&1 &
          SIDECAR_PID=$!
          trap 'kill "$SIDECAR_PID" 2>/dev/null || true' EXIT
          TAURI_SIDECAR_PORT=13998 \
          TAURI_SMOKE_OUTPUT=artifacts/tauri-smoke.json \
          npm run test:tauri:smoke
      - name: Upload Tauri sidecar diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-sidecar-smoke-macos
          path: artifacts/tauri-smoke.json
          if-no-files-found: error
          retention-days: 14
